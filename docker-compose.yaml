services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        env-file:
            - ./backend/.env

    pgservice:
        image: postgres:15-alpine
        env-file:
            - ./backend/.env
        ports:
            - "5432:5432"
        volumes:
            - ./backend/data:/var/lib/postgresql/data
    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - ./backend/data:/data

volumes:
    postgres_data:
    redis_data:
